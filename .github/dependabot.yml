version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  # The dev container's Go and golangci-lint images. Keep golangci-lint's version in
  # .github/workflows/ci.yml the same. A new Go minor version is raised together with
  # go.mod by hand, so only its patch releases and digests come from here.
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    groups:
      devcontainer:
        patterns: ["*"]
    ignore:
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
