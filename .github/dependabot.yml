version: 2
updates:
  # The modules are built into the image, so an update is a fix release-please
  # releases. go-proxmox stays at the version CAPMOX pins, and is raised by hand with
  # it.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(deps)"
    groups:
      go:
        patterns: ["*"]
    ignore:
      - dependency-name: github.com/luthermonson/go-proxmox

  # The release image: its Go compiler and base image end up in the image, so an
  # update is a fix release-please releases. A new Go minor version is raised together
  # with go.mod by hand, so only its patch releases and digests come from here.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(deps)"
    groups:
      image:
        patterns: ["*"]
    ignore:
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The dev container, which no release contains. Keep golangci-lint's version in
  # .github/workflows/ci.yml the same, and Go's the same as the release image's.
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      devcontainer:
        patterns: ["*"]
    ignore:
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
