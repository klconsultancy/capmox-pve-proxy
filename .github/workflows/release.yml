name: Release

# release-please keeps a release pull request open with the next version and its
# changelog, from the Conventional Commits titles on main. Merging it tags the
# release, which builds the image and the Helm chart that runs it, and adds both to the
# GitHub release.
#
# A release candidate is a tag such as v1.2.3-rc.1 on main, pushed by an admin (the
# "release tags" ruleset): it builds the image and the chart the same way, as a
# pre-release, so they can be tested against real nodes before the release pull
# request is merged.
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CHART: ghcr.io/${{ github.repository_owner }}/charts/capmox-pve-proxy

jobs:
  release-please:
    name: Release PR
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A GitHub App token instead of GITHUB_TOKEN, so CI runs on the release PR. The
      # app may also create the version tags the "release tags" ruleset protects.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  image:
    needs: release-please
    # always(): on a release candidate's tag, release-please is skipped.
    if: always() && (needs.release-please.outputs.release_created == 'true' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
    permissions:
      contents: read
      packages: write # the image on GHCR
      id-token: write # signing the attestation
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # No "latest": the image is meant to be pinned by digest.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
      # BuildKit adds each platform's provenance and SBOM to the image index.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.TAG }}
          provenance: mode=max
          sbom: true
      # A signed build provenance attestation of the index, checked with
      # `gh attestation verify`. It covers BuildKit's SBOMs too: they are part of the
      # index it names by digest.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # An artifact-metadata storage record would need one more permission and
          # is only of use for GitHub's linked-artifacts view, which this repo
          # doesn't use.
          create-storage-record: false

  # The Helm chart, at the release's version, with the digest of the image built above:
  # the published chart runs exactly that image unless told otherwise.
  chart:
    needs: [release-please, image]
    if: always() && needs.image.result == 'success'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
      DIGEST: ${{ needs.image.outputs.digest }}
    permissions:
      contents: read
      packages: write # the chart on GHCR
      id-token: write # signing the attestation
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      # sed rather than yq, which would drop values.yaml's blank lines; yq checks the
      # result. The chart's version is the tag's, so a release candidate's chart is one
      # too: release-please has not bumped Chart.yaml for it.
      - name: Package the chart
        run: |
          values=charts/capmox-pve-proxy/values.yaml
          sed -i "s|^  digest: \"\"$|  digest: \"$DIGEST\"|" "$values"
          test "$(yq .image.digest "$values")" = "$DIGEST"
          helm lint --strict charts/capmox-pve-proxy -f charts/capmox-pve-proxy/ci/example-values.yaml
          helm package charts/capmox-pve-proxy --version "${TAG#v}" --app-version "${TAG#v}" --destination dist
      - id: push
        name: Push the chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"
          out=$(helm push "dist/capmox-pve-proxy-${TAG#v}.tgz" "oci://${CHART%/*}")
          echo "$out"
          digest=$(sed -n 's/^Digest: //p' <<<"$out")
          [[ $digest == sha256:* ]] || { echo "no digest in helm push's output"; exit 1; }
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      # A signed build provenance attestation of the chart, as for the image.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.CHART }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  release-notes:
    name: Release notes
    needs: [release-please, image, chart]
    if: always() && needs.image.result == 'success' && needs.chart.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
    steps:
      # release-please made the release; a release candidate gets a pre-release here.
      - name: Add the image and the chart to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
          DIGEST: ${{ needs.image.outputs.digest }}
          CHART_DIGEST: ${{ needs.chart.outputs.digest }}
        run: |
          header="Image: \`$IMAGE@$DIGEST\`

          Chart: \`oci://$CHART\` version \`${TAG#v}\` (\`$CHART@$CHART_DIGEST\`), which runs this image.

          Verify them with \`gh attestation verify oci://$IMAGE@$DIGEST --repo $GITHUB_REPOSITORY\` and \`gh attestation verify oci://$CHART@$CHART_DIGEST --repo $GITHUB_REPOSITORY\`."
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --generate-notes --notes "$header"
          else
            changelog=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$header

          $changelog"
          fi
