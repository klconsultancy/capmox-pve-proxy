name: Dependabot

# Merges a Dependabot pull request once main's required checks pass, unless it raises
# a major version, which is left for review. A release still needs the release pull
# request to be merged by hand.
on:
  pull_request:

permissions: {}

jobs:
  auto-merge:
    name: Auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata
      # A GitHub App token instead of GITHUB_TOKEN, as a merge with GITHUB_TOKEN would
      # not run the workflows on main, release-please's among them. Dependabot's runs
      # see only Dependabot secrets, so the key is one of those too.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.html_url }}
