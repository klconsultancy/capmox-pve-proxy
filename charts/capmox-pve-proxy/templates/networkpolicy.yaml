{{- if .Values.networkPolicy.enabled }}
# Ingress only from CAPMOX's namespace. Egress is left open: the proxy calls the nodes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "capmox-pve-proxy.fullname" . }}
  labels:
    {{- include "capmox-pve-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "capmox-pve-proxy.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.namespaceSelector | nindent 12 }}
      ports:
        - port: {{ include "capmox-pve-proxy.portName" . }}
          protocol: TCP
{{- end }}
